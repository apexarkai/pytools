[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytools"
version = "0.1.0"
description = "A small collection of standalone CLI utilities (dedup finder, text substitution)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rkyo" }]

[project.scripts]
find-dup = "pytools.find_dup:main"
sub-text = "pytools.sub_text:main"

[project.optional-dependencies]
dev = ["black>=24", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
